name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Enforce design tokens
        run: ruby scripts/check-design-tokens.rb
      - name: Test package with strict warnings
        run: swift test --package-path Packages/SpellbookKit -Xswiftc -warnings-as-errors
      - name: Build and run macOS UI tests
        run: |
          xcodebuild \
            -project Spellbook.xcodeproj \
            -scheme Spellbook \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build test
