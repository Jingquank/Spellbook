name: Spellbook
options:
  bundleIdPrefix: com.keding
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  SpellbookKit:
    path: Packages/SpellbookKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Spellbook:
    type: application
    platform: macOS
    sources:
      - path: App/SpellbookApp
    dependencies:
      - package: SpellbookKit
        product: SpellbookCore
      - package: SpellbookKit
        product: SpellbookMarkdown
      - package: SpellbookKit
        product: SpellbookInfrastructure
      - package: SpellbookKit
        product: SpellbookUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keding.Spellbook
        PRODUCT_NAME: Spellbook
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spellbook
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Ke Ding
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      testTargets:
        - SpellbookUITests
  SpellbookUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: App/SpellbookUITests
    dependencies:
      - target: Spellbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keding.SpellbookUITests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
